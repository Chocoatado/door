	<script>
		document.addEventListener("DOMContentLoaded", function () {
			var envelopeBtn = document.getElementById("envelopeBtn");
			var letterModal = document.getElementById("letterModal");
			var closeLetter = document.getElementById("closeLetter");
			var typedLetter = document.getElementById("typedLetter");
var typingTimer = null;
var finaleOverlay = document.getElementById("finaleOverlay");
var finaleLottie = document.getElementById("finaleLottie");
var finaleShown = false;

function showFinale() {
	if (finaleShown) {
		return;
	}

	finaleShown = true;
	finaleOverlay.classList.add("show");

	if (finaleLottie) {
		finaleLottie.stop();
		finaleLottie.play();
	}

	setTimeout(function () {
		finaleOverlay.classList.remove("show");
	}, 6000);
}

var letterText = `To：my lovely 牛
依旧见字如面！
距离上一次给你手写信整整一年，又是一年你的生日啦！非常有幸在认识你的日子里参与了两次生日～
当我再一次低头写信的时候，浮现眼前的是你垂眸读信的样子。想到你一个字一个字认真读信，看到缱倦的话语时上扬的嘴角和湿润的眼睛，我想那一刻你是无比幸福～当然，在我写下这段文字时，我同样无比幸福，和你一样！
磨合期真实过去之后，我才意识到它曾经存在过。我好像不再像以前一样在你忙不开工作无暇找我的时候拐弯抹角的生闷气了，适当的“放手”并没有我以为的那样丧失安全感和分享欲，我好像真的在你的陪伴下成长了很多！
其实一直很感激你在我身边，这么想来真的有在被托举的感觉，在你的身边总会有一种“我自由奔跑你帮我兜底”的踏实和舒心，我也卸下了所有的包袱，追着你耍赖，你就这样忍受我的小脾气和没轻没重的手。感觉白天分别的时候一吻，两个人外出工作，回家做一顿爱吃的饭，晚上坐在彼此的身边，即使不在玩同一个游戏，都是我从小想象中的安安稳稳的幸福，有遇到你一定是我抽到的最大幸运奖！
今天是你的生日～你已经是我认知里成熟的大人啦，成长的道路上你一定经历了很多我想不到也还没遇到的困难，所以你能足够的从容去面对生活上的各种事情，也能自如的控制自己的情绪（ps：你真的稳定的让我觉得你根本不需要控制情绪啊…！！），生活上我只有被你指导的份～但是依旧祝愿你的每一个明天，都比昨天更通透，坦然，自由，快乐
祝好～那些数不尽的明天，我会在你身边
爱你的群♡`;

function startTypingLetter() {
	clearTimeout(typingTimer);
	typedLetter.textContent = "";

	var index = 0;
	var TYPE_SPEED = 85;

function typeNextChar() {
	if (index >= letterText.length) {
		setTimeout(function () {
			showFinale();
		}, 500);
		return;
	}

		var currentChar = letterText.charAt(index);
		typedLetter.textContent += currentChar;
		index++;

		var delay = TYPE_SPEED;

		if ("，。！？、；：".indexOf(currentChar) !== -1) {
			delay = 260;
		}

		if (currentChar === "\n") {
			delay = 420;
		}

		typingTimer = setTimeout(typeNextChar, delay);
	}

	typeNextChar();
}

function showFullLetter() {
	clearTimeout(typingTimer);
	typedLetter.textContent = letterText;

	setTimeout(function () {
		showFinale();
	}, 500);
}

function fadeBgmVolume(targetVolume, duration) {
	if (!window.BIRTHDAY_BGM) {
		return;
	}

	var startVolume = window.BIRTHDAY_BGM.volume;
	var startTime = Date.now();

	function updateVolume() {
		var elapsed = Date.now() - startTime;
		var progress = Math.min(elapsed / duration, 1);

		window.BIRTHDAY_BGM.volume = startVolume + (targetVolume - startVolume) * progress;

		if (progress < 1) {
			requestAnimationFrame(updateVolume);
		}
	}

	updateVolume();
}

envelopeBtn.addEventListener("click", function () {
	finaleShown = false;
	finaleOverlay.classList.remove("show");

	letterModal.classList.add("show");

	// 打开信时，背景音乐慢慢降低
	fadeBgmVolume(0.06, 1800);

	setTimeout(function () {
		startTypingLetter();
	}, 1000);
});

closeLetter.addEventListener("click", function () {
	letterModal.classList.remove("show");
	clearTimeout(typingTimer);

	// 关掉信后，音乐稍微恢复
	fadeBgmVolume(0.16, 1200);
});

letterModal.addEventListener("click", function (event) {
	if (event.target === letterModal) {
		letterModal.classList.remove("show");
		clearTimeout(typingTimer);

		// 点背景关掉信后，音乐稍微恢复
		fadeBgmVolume(0.16, 1200);
	}
});
letterModal.addEventListener("dblclick", function () {
	if (letterModal.classList.contains("show")) {
		showFullLetter();
	}
});

var currentPage = 1;
var totalPages = 3;
var wholeContainer = document.getElementById("whole_container");
var prevPage = document.getElementById("prevPage");
var nextPage = document.getElementById("nextPage");
var introCanvas = document.getElementById("canvas_intro");

function triggerIntroPeepSway() {
	if (!window.level || !window.level.player) {
		return;
	}

	if (currentPage !== 1) {
		return;
	}

	if (typeof window.level.player.cuteSway === "function") {
		window.level.player.cuteSway();
	}
}

introCanvas.addEventListener("click", function (event) {
	if (!window.level || !window.level.player) {
		return;
	}

	if (currentPage !== 1) {
		return;
	}

	var rect = introCanvas.getBoundingClientRect();
	var clickX = event.clientX - rect.left;
	var clickY = event.clientY - rect.top;

	var player = window.level.player;

	var introScale = 1.5;
	var playerScreenX = player.x * introScale - introCanvas.width * 0.25;
	var playerScreenY = player.y * introScale - introCanvas.height * 0.25;

	var dx = clickX - playerScreenX;
	var dy = clickY - playerScreenY;
	var distance = Math.sqrt(dx * dx + dy * dy);

	if (distance < 95) {
		triggerIntroPeepSway();
	}
});

function restartFirstPageGame() {
	if (typeof Level === "function" && typeof INTRO_LEVEL !== "undefined") {
		STAGE = 0;
		window.level = new Level(window.INTRO_LEVEL, true);
	}
}

function updatePageButtons() {
	if (currentPage === 1) {
		prevPage.style.display = "none";
	} else {
		prevPage.style.display = "inline-block";
	}

	if (currentPage === 3) {
		nextPage.style.display = "none";
	} else {
		nextPage.style.display = "inline-block";
	}
}

function syncCurrentPageFromPosition() {
	var topValue = wholeContainer.style.top || "0px";

	if (topValue.indexOf("-200") !== -1) {
		currentPage = 3;
	} else if (topValue.indexOf("-100") !== -1) {
		currentPage = 2;
	} else {
		currentPage = 1;
	}

	updatePageButtons();
}

function goToPage(pageNumber) {
	if (pageNumber < 1) {
		pageNumber = 1;
	}

	if (pageNumber > totalPages) {
		pageNumber = totalPages;
	}

	currentPage = pageNumber;

	if (currentPage === 1) {
		restartFirstPageGame();
	}

	wholeContainer.style.top = "-" + ((currentPage - 1) * 100) + "%";

	updatePageButtons();
}

			prevPage.addEventListener("click", function () {
				goToPage(currentPage - 1);
			});

			nextPage.addEventListener("click", function () {
				goToPage(currentPage + 1);
			});

			document.addEventListener("keydown", function (event) {
				if (event.key === "PageUp") {
					goToPage(currentPage - 1);
				}

				if (event.key === "PageDown") {
					goToPage(currentPage + 1);
				}
			});

			setInterval(function () {
				syncCurrentPageFromPosition();
			}, 300);

			goToPage(1);
		});
	</script>
