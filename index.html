function fadeBgmVolume(targetVolume, duration) {
	if (!window.BIRTHDAY_BGM) {
		return;
	}

	var startVolume = window.BIRTHDAY_BGM.volume;
	var startTime = Date.now();

	function updateVolume() {
		var elapsed = Date.now() - startTime;
		var progress = Math.min(elapsed / duration, 1);

		window.BIRTHDAY_BGM.volume = startVolume + (targetVolume - startVolume) * progress;

		if (progress < 1) {
			requestAnimationFrame(updateVolume);
		}
	}

	updateVolume();
}

	<script>
var thirdPeepStarted = false;
var thirdPeepCanvas = null;
var thirdPeepCtx = null;
var thirdPeep = null;
var thirdPeepTrail = [];

function startThirdPagePeep() {
	if (thirdPeepStarted) {
		return;
	}

	if (typeof Peep !== "function") {
		return;
	}

	thirdPeepStarted = true;

	thirdPeepCanvas = document.getElementById("thirdPeepCanvas");
	thirdPeepCtx = thirdPeepCanvas.getContext("2d");

	function resizeThirdPeepCanvas() {
		thirdPeepCanvas.width = window.innerWidth;
		thirdPeepCanvas.height = window.innerHeight;
	}

	resizeThirdPeepCanvas();
	window.addEventListener("resize", resizeThirdPeepCanvas);

	thirdPeepCanvas.style.display = "block";

var thirdPeepScale = 1.5;

var fakeLevel = {
	width: thirdPeepCanvas.width / thirdPeepScale,
	height: thirdPeepCanvas.height / thirdPeepScale,
	circles: []
};

thirdPeep = new Peep({
	x: thirdPeepCanvas.width / thirdPeepScale / 2,
	y: thirdPeepCanvas.height / thirdPeepScale * 0.72
}, fakeLevel);

thirdPeepCanvas.addEventListener("click", function(event) {
	var rect = thirdPeepCanvas.getBoundingClientRect();

	var clickX = (event.clientX - rect.left) * (thirdPeepCanvas.width / rect.width);
	var clickY = (event.clientY - rect.top) * (thirdPeepCanvas.height / rect.height);

	// 因为第三页小人被放大了 1.5 倍，
	// 所以点击坐标也要除以 thirdPeepScale，换回小人的真实坐标
	var clickWorldX = clickX / thirdPeepScale;
	var clickWorldY = clickY / thirdPeepScale;

	var dx = clickWorldX - thirdPeep.x;
	var dy = clickWorldY - thirdPeep.y;
	var distance = Math.sqrt(dx * dx + dy * dy);

	if (distance < 110) {
		if (typeof thirdPeep.cuteSway === "function") {
			thirdPeep.cuteSway();
		}

		if (typeof thirdPeep.showPeep2Once === "function") {
			thirdPeep.showPeep2Once();
		}
	}
});

var thirdPeepFrameCount = 0;

function animateThirdPeep() {
	requestAnimationFrame(animateThirdPeep);

	if (!thirdPeep) {
		return;
	}

	var topValue = document.getElementById("whole_container").style.top || "0px";

if (topValue.indexOf("-300") === -1) {
	thirdPeepCtx.clearRect(0, 0, thirdPeepCanvas.width, thirdPeepCanvas.height);
	return;
}

	fakeLevel.width = thirdPeepCanvas.width / thirdPeepScale;
	fakeLevel.height = thirdPeepCanvas.height / thirdPeepScale;

	thirdPeepFrameCount++;

	if (thirdPeepFrameCount % 2 === 0) {
		var beforeX = thirdPeep.x;
		var beforeY = thirdPeep.y;

		thirdPeep.update();

		var movedDistance = Math.sqrt(
			Math.pow(thirdPeep.x - beforeX, 2) +
			Math.pow(thirdPeep.y - beforeY, 2)
		);

		if (movedDistance > 0.8) {
			thirdPeepTrail.push({
				x: thirdPeep.x,
				y: thirdPeep.y,
				life: 1
			});
		}
	}

	thirdPeepCtx.clearRect(0, 0, thirdPeepCanvas.width, thirdPeepCanvas.height);

	thirdPeepCtx.save();
	thirdPeepCtx.scale(thirdPeepScale, thirdPeepScale);

	if (thirdPeepTrail.length > 1) {
		for (var i = 1; i < thirdPeepTrail.length; i++) {
			var p1 = thirdPeepTrail[i - 1];
			var p2 = thirdPeepTrail[i];

			thirdPeepCtx.beginPath();
			thirdPeepCtx.moveTo(p1.x, p1.y);
			thirdPeepCtx.lineTo(p2.x, p2.y);
			thirdPeepCtx.strokeStyle = "rgba(255, 255, 255, " + (p2.life * 0.9) + ")";
			thirdPeepCtx.lineWidth = 10 / thirdPeepScale;
			thirdPeepCtx.lineCap = "round";
			thirdPeepCtx.lineJoin = "round";
			thirdPeepCtx.stroke();
		}
	}

// 在拖尾后面画一个小爱心
if (thirdPeepTrail.length > 8 && images.key) {
	var heartIndex = Math.max(0, thirdPeepTrail.length - 8);
	var heartPoint = thirdPeepTrail[heartIndex];

	thirdPeepCtx.save();
	thirdPeepCtx.globalAlpha = heartPoint.life * 0.95;

	var heartSize = 34;
	var heartX = heartPoint.x;
	var heartY = heartPoint.y - 34;

	thirdPeepCtx.drawImage(
		images.key,
		heartX - heartSize / 2,
		heartY - heartSize / 2,
		heartSize,
		heartSize * 0.6
	);

	thirdPeepCtx.restore();
}

thirdPeep.drawShadow(thirdPeepCtx);
thirdPeep.draw(thirdPeepCtx);

thirdPeepCtx.restore();

	for (var j = thirdPeepTrail.length - 1; j >= 0; j--) {
		thirdPeepTrail[j].life -= 0.012;

		if (thirdPeepTrail[j].life <= 0) {
			thirdPeepTrail.splice(j, 1);
		}
	}
}

	animateThirdPeep();
}
