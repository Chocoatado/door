<!doctype html>
<html>
<head>
	<title>Happy Birthday to Niuniu</title>
	<meta name="description" content="A birthday surprise for Niuniu."/>
	<link rel="icon" type="image/png" href="favicon.png">

	<meta itemprop="name" content="Happy Birthday to Niuniu">
	<meta itemprop="description" content="A birthday surprise for Niuniu.">
	<meta itemprop="image" content="thumbnail.png">

	<meta property="og:title" content="Happy Birthday to Niuniu">
	<meta property="og:type" content="website">
	<meta property="og:image" content="thumbnail.png">
	<meta property="og:description" content="A birthday surprise for Niuniu.">
	<meta property="og:site_name" content="Happy Birthday to Niuniu">

	<link rel="stylesheet" type="text/css" href="css/index.css"> 
</head>

<body>

	<div id="loading"><div>LOADING</div></div>

	<div id="whole_container">

		<div id="screen_one">
			<canvas id="canvas_intro"></canvas>

			<div id="birthday_title_layer">
				<div class="intro_circle"></div>

				<div class="birthday_words">
					<div class="birthday_heart">♡</div>
					<h1>happy birthday<br>to Niuniu</h1>
					<p>press arrow keys to move</p>
				</div>
			</div>
		</div>

		<div id="screen_two">
			<div id="canvas_container">

				<canvas id="canvas_1" width="300" height="380"></canvas>
				<canvas id="canvas_2" width="300" height="380"></canvas>
				<canvas id="canvas_3" width="300" height="380" style="margin:0"></canvas>
				
				<div id="valentines_text"></div>
				<div id="rewind_text">rewinding...</div>
				<div id="replay_text">playing back...</div>

			</div>
		</div>

		<div id="screen_three">
			<div id="birthday_end">

				<h1 class="end_title">A little birthday letter for you ♡</h1>

				<button id="envelopeBtn" class="envelope" type="button">
					<div class="envelope_flap"></div>
					<div class="envelope_body"></div>
					<div class="envelope_heart">♡</div>
				</button>

				<p class="tap_hint">Tap the envelope</p>

				<div id="end_container" style="display:none;">
					<input id="your_message" placeholder=""></input>
					<input id="your_link" readonly></input>

					<div id="share">
						<div id="share_facebook"></div>
						<div id="share_twitter"></div>
						<div id="share_plus"></div>
						<div id="share_tumblr"></div>
						<div id="share_reddit"></div>
						<div id="share_stumbleupon"></div>
					</div>
				</div>

			</div>
		</div>
		
	</div>

	<div id="pageNav" class="page_nav">
		<button id="prevPage" type="button">the past surprise</button>
		<button id="nextPage" type="button">the next surprise</button>
	</div>

	<div id="letterModal" class="letter_modal">
		<div class="letter_paper">
			<button id="closeLetter" class="close_letter" type="button">×</button>

			<img class="letter_image" src="assets/letter.jpg" alt="birthday letter">

		</div>
	</div>

	<script src="js/Key.js"></script>
	<script src="js/game.js"></script>
	<script src="js/popup.js"></script>
	<script src="js/soundjs-0.6.0.min.js"></script>

	<script>
		document.addEventListener("DOMContentLoaded", function () {
			var envelopeBtn = document.getElementById("envelopeBtn");
			var letterModal = document.getElementById("letterModal");
			var closeLetter = document.getElementById("closeLetter");

			envelopeBtn.addEventListener("click", function () {
				letterModal.classList.add("show");
			});

			closeLetter.addEventListener("click", function () {
				letterModal.classList.remove("show");
			});

			letterModal.addEventListener("click", function (event) {
				if (event.target === letterModal) {
					letterModal.classList.remove("show");
				}
			});

			var currentPage = 1;
			var totalPages = 3;
			var wholeContainer = document.getElementById("whole_container");
			var prevPage = document.getElementById("prevPage");
			var nextPage = document.getElementById("nextPage");

			function goToPage(pageNumber) {
				if (pageNumber < 1) {
					pageNumber = 1;
				}

				if (pageNumber > totalPages) {
					pageNumber = totalPages;
				}

				currentPage = pageNumber;
				wholeContainer.style.top = "-" + ((currentPage - 1) * 100) + "%";

				if (currentPage === 1) {
					prevPage.style.display = "none";
				} else {
					prevPage.style.display = "inline-block";
				}

				if (currentPage === 3) {
					nextPage.style.display = "none";
				} else {
					nextPage.style.display = "inline-block";
				}
			}

			prevPage.addEventListener("click", function () {
				goToPage(currentPage - 1);
			});

			nextPage.addEventListener("click", function () {
				goToPage(currentPage + 1);
			});

			document.addEventListener("keydown", function (event) {
				if (event.key === "PageUp") {
					goToPage(currentPage - 1);
				}

				if (event.key === "PageDown") {
					goToPage(currentPage + 1);
				}
			});

			goToPage(1);
		});
	</script>

</body>
</html>
